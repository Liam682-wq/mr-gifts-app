<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr Gifts Administracion</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mr Gifts">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--txt:#1d2330;--mut:#6b7280;--acc:#2563eb;--line:#e5e7eb;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1c2128;--txt:#e6e8ec;--mut:#9aa3af;--line:#2d333b;color-scheme:dark}}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt)}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line);padding:12px 14px;z-index:5}
h1{font-size:18px;margin:0 0 8px}
nav{display:flex;gap:6px}nav button{flex:1}
button{font:inherit;border:0;border-radius:8px;padding:9px 12px;background:var(--line);color:var(--txt);cursor:pointer}
button.p{background:var(--acc);color:#fff}
main{padding:12px;max-width:640px;margin:auto;padding-bottom:90px}
input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#1d2330}
.row{display:flex;gap:8px}.row>*{flex:1}
.card{color:#000;border:2px solid #000;border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:16px}
.card .sel{flex:0 0 auto;width:auto;font-size:13px;padding:6px;font-weight:600}
.meta{font-size:13px;color:#111;line-height:1.6}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.08);margin-right:6px}
.photos{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.photos img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer}
.phs{display:grid;gap:8px;grid-template-columns:1fr}
.ph{border:1px dashed var(--mut);border-radius:8px;padding:8px;font-size:13px}
.ph .btns{display:flex;gap:6px;margin-top:6px}
.ph img{width:100%;max-height:140px;object-fit:cover;border-radius:6px;margin-top:6px}
.fab{position:fixed;bottom:16px;right:16px;border-radius:99px;padding:14px 20px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
dialog{border:0;border-radius:14px;width:min(560px,94vw);max-height:92vh;padding:16px;background:var(--card);color:var(--txt)}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11px;text-align:center;color:var(--mut)}
.day{min-height:52px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:4px;font-size:13px;text-align:left;color:var(--txt)}
.day.today{border-color:var(--acc)}.day.sel{background:var(--acc);color:#fff}
.dot{font-size:10px;display:block;margin-top:4px}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>📦 Mr Gifts Administracion</h1>
  <nav><button id="tabP" class="p">Pedidos</button><button id="tabC">Calendario</button></nav>
</header>

<main>
  <section id="vPedidos">
    <input id="q" placeholder="Buscar por guía, cliente, producto o fecha…" style="margin-bottom:8px">
    <div class="row" style="margin-bottom:10px">
      <select id="fDest"></select>
      <select id="fEst"></select>
    </div>
    <div id="lista"></div>
  </section>

  <section id="vCal" class="hidden">
    <div class="row" style="margin-bottom:8px;align-items:center">
      <button id="prev">◀</button>
      <strong id="mes" style="text-align:center;text-transform:capitalize"></strong>
      <button id="next">▶</button>
    </div>
    <div class="grid" id="grid"></div>
    <h3 id="selTit" style="margin:16px 0 8px;font-size:15px"></h3>
    <div id="diaLista"></div>
  </section>
</main>

<button id="nuevo" class="p fab">+ Nuevo</button>
<div id="aviso" style="display:none;position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:10px;z-index:99;max-width:92vw;font-size:14px"></div>

<dialog id="dlg">
  <form id="form">
    <h2 id="dlgTit" style="margin:0 0 4px;font-size:17px"></h2>

    <label>Estado</label>
    <select id="fEstado"></select>

    <label>Número de guía o pedido *</label>
    <input id="fGuia" required>

    <label>Cliente *</label>
    <input id="fCli" required>

    <label>Tipo de producto (escríbelo libre)</label>
    <input id="fProd" list="prodList" placeholder="Ej. audífonos, tazas, etiquetas…">
    <datalist id="prodList"></datalist>

    <label>Destino</label>
    <select id="fCat"></select>

    <div class="row">
      <div><label>Fecha *</label><input type="date" id="fFecha" required></div>
      <div><label>Hora</label><input type="time" id="fHora"></div>
    </div>

    <label>Notas</label>
    <textarea id="fNotas" rows="2"></textarea>

    <label>Fotos (las 3 son necesarias para marcar como completado)</label>
    <div class="phs">
      <div class="ph" data-k="paquete"><b>📦 Paquete</b><div class="btns"><button type="button" data-cam>📷 Cámara</button><button type="button" data-gal>🖼 Galería</button></div><input type="file" accept="image/*" hidden><img alt="" style="display:none"></div>
      <div class="ph" data-k="caja"><b>🗳️ Caja de envío</b><div class="btns"><button type="button" data-cam>📷 Cámara</button><button type="button" data-gal>🖼 Galería</button></div><input type="file" accept="image/*" hidden><img alt="" style="display:none"></div>
      <div class="ph" data-k="factura"><b>🧾 Factura de envío</b><div class="btns"><button type="button" data-cam>📷 Cámara</button><button type="button" data-gal>🖼 Galería</button></div><input type="file" accept="image/*" hidden><img alt="" style="display:none"></div>
    </div>

    <div id="avisoF" style="display:none;background:#fee2e2;color:#7f1d1d;font-weight:600;padding:10px;border-radius:8px;margin-top:12px;font-size:14px"></div>
    <div class="row" style="margin-top:16px">
      <button type="button" id="borrar" style="flex:0 0 auto;color:#dc2626">Eliminar</button>
      <button type="button" id="cancel">Cancelar</button>
      <button type="submit" class="p">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="cam">
  <video id="vid" autoplay playsinline muted style="width:100%;border-radius:8px;background:#000;min-height:200px"></video>
  <canvas id="cv" hidden></canvas>
  <div id="camMsg" class="meta" style="margin:8px 0"></div>
  <div class="row">
    <button type="button" id="camCancel">Cerrar</button>
    <button type="button" class="p" id="snap">📸 Capturar</button>
  </div>
</dialog>

<dialog id="viewer" style="width:auto;padding:0;background:#000">
  <img id="big" alt="" style="max-width:94vw;max-height:88vh;display:block" onclick="this.closest('dialog').close()">
</dialog>

<script>
const CATS0 = ["Tienda", "Paquetería", "Departamental"];
const ESTADOS = [
  ["pendiente", "Pendiente", "#fde68a"],
  ["empaquetar", "Por empaquetar", "#d8b4fe"],
  ["enviar", "Por enviar", "#86efac"],
  ["completado", "Completado", "#fca5a5"]
];
const EST = Object.fromEntries(ESTADOS.map(([k, l, c]) => [k, {l, c}]));
const NOMBRES = {paquete:"Paquete", caja:"Caja de envío", factura:"Factura de envío"};
const $ = s => document.querySelector(s);
let orders = [], cats = [], photos = {}, editId = null, cur = new Date(), selDay = null;
let stream = null, camK = null;

// ---------- Almacenamiento (IndexedDB, guarda también las fotos) ----------
const DB = new Promise((res, rej) => {
  const r = indexedDB.open("controlEnvios", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("kv");
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function kvGet(k){ const db = await DB; return new Promise(res => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); }); }
async function kvSet(k, v){ const db = await DB; return new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
const saveOrders = () => kvSet("orders", orders);

// ---------- Utilidades ----------
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hoy = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
let avisoT = null;
function aviso(t){
  const d = $("#dlg").open ? $("#avisoF") : $("#aviso");
  d.textContent = t; d.style.display = "block";
  clearTimeout(avisoT); avisoT = setTimeout(() => d.style.display = "none", 4500);
}
const faltan = o => ["paquete","caja","factura"].filter(k => !o.fotos?.[k]);
const msgFaltan = o => "Falta agregar foto: " + faltan(o).map(k => NOMBRES[k]).join(", ") + ". No se puede completar el pedido hasta tener las 3 fotos.";

function reducir(source, w, h){
  const s = Math.min(1, 900 / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = w * s; c.height = h * s;
  c.getContext("2d").drawImage(source, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.75);
}
function comprimir(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const d = reducir(img, img.width, img.height); URL.revokeObjectURL(url); res(d); };
    img.onerror = rej;
    img.src = url;
  });
}

// ---------- Listas y filtros ----------
function fillFilters(){
  $("#fDest").innerHTML = '<option value="">Todos los destinos</option>' + cats.map(c => `<option>${esc(c)}</option>`).join("");
  $("#fEst").innerHTML = '<option value="">Todos los estados</option>' + ESTADOS.map(([k, l]) => `<option value="${k}">${l}</option>`).join("");
  $("#fCat").innerHTML = cats.map(c => `<option>${esc(c)}</option>`).join("");
  $("#fEstado").innerHTML = ESTADOS.map(([k, l]) => `<option value="${k}">${l}</option>`).join("");
  const prods = [...new Set(orders.map(o => o.producto).filter(Boolean))];
  $("#prodList").innerHTML = prods.map(p => `<option value="${esc(p)}">`).join("");
}

const card = o => `
<div class="card" style="background:${EST[o.estado].c}">
  <div class="row" style="align-items:flex-start">
    <div style="flex:1;min-width:0"><h3>${esc(o.guia)} · ${esc(o.cliente)}</h3></div>
    <select class="sel" data-s="${esc(o.id)}" aria-label="Estado">
      ${ESTADOS.map(([k, l]) => `<option value="${k}" ${o.estado === k ? "selected" : ""}>${l}</option>`).join("")}
    </select>
  </div>
  <div class="meta">
    <span class="badge">${esc(o.destino)}</span>${esc(o.producto || "Sin tipo de producto")}<br>
    📅 ${esc(o.fecha)} ${esc(o.hora || "")} · Fotos ${3 - faltan(o).length}/3
  </div>
  ${o.notas ? `<div class="meta">📝 ${esc(o.notas)}</div>` : ""}
  <div class="photos">${["paquete","caja","factura"].map(k => o.fotos?.[k] ? `<img src="${o.fotos[k]}" data-v="${esc(o.id)}|${k}" alt="${NOMBRES[k]}">` : "").join("")}</div>
  <div style="margin-top:8px"><button data-e="${esc(o.id)}">Editar</button></div>
</div>`;

function render(){
  const q = $("#q").value.toLowerCase(), fd = $("#fDest").value, fe = $("#fEst").value;
  const list = orders
    .filter(o => (!fd || o.destino === fd) && (!fe || o.estado === fe))
    .filter(o => !q || [o.guia, o.cliente, o.producto, o.fecha].join(" ").toLowerCase().includes(q))
    .sort((a, b) => (b.fecha + (b.hora || "")).localeCompare(a.fecha + (a.hora || "")));
  $("#lista").innerHTML = list.length ? list.map(card).join("") : '<div class="empty">Sin pedidos</div>';
}

// ---------- Calendario ----------
function renderCal(){
  const y = cur.getFullYear(), m = cur.getMonth();
  $("#mes").textContent = cur.toLocaleDateString("es", {month:"long", year:"numeric"});
  const start = (new Date(y, m, 1).getDay() + 6) % 7;
  const dias = new Date(y, m + 1, 0).getDate();
  const hoyS = hoy(new Date());
  let h = ["L","M","X","J","V","S","D"].map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < start; i++) h += "<div></div>";
  for (let d = 1; d <= dias; d++){
    const s = `${y}-${String(m + 1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const n = orders.filter(o => o.fecha === s).length;
    h += `<button class="day ${s === hoyS ? "today" : ""} ${s === selDay ? "sel" : ""}" data-d="${s}">${d}${n ? `<span class="dot">${n} env.</span>` : ""}</button>`;
  }
  $("#grid").innerHTML = h;
  if (!selDay) selDay = hoyS;
  const dia = orders.filter(o => o.fecha === selDay).sort((a, b) => (a.hora || "").localeCompare(b.hora || ""));
  $("#selTit").textContent = "Envíos del " + selDay;
  $("#diaLista").innerHTML = dia.length ? dia.map(card).join("") : '<div class="empty">No hay envíos este día</div>';
}

// ---------- Fotos ----------
function renderPhotos(){
  document.querySelectorAll(".ph").forEach(b => {
    const k = b.dataset.k, img = b.querySelector("img");
    img.src = photos[k] || "";
    img.style.display = photos[k] ? "block" : "none";
    b.querySelector("[data-cam]").textContent = photos[k] ? "📷 Repetir" : "📷 Cámara";
  });
}
document.querySelectorAll(".ph").forEach(box => {
  const k = box.dataset.k, inp = box.querySelector("input");
  box.querySelector("[data-cam]").onclick = () => abrirCamara(k);
  box.querySelector("[data-gal]").onclick = () => inp.click();
  inp.onchange = async () => {
    if (inp.files[0]) { photos[k] = await comprimir(inp.files[0]); inp.value = ""; renderPhotos(); }
  };
});

// Cámara integrada: pide permiso al navegador y toma la foto dentro de la app
async function abrirCamara(k){
  camK = k;
  $("#camMsg").textContent = "Abriendo cámara… acepta el permiso si el navegador lo pide.";
  $("#cam").showModal();
  try {
    stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: "environment"}}, audio: false});
    $("#vid").srcObject = stream;
    $("#camMsg").textContent = "";
  } catch (err) {
    $("#camMsg").textContent = "No se pudo abrir la cámara (permiso denegado o no disponible en esta vista). Usa 🖼 Galería, o abre la app en el navegador del celular.";
  }
}
function pararCamara(){
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $("#vid").srcObject = null;
}
$("#cam").addEventListener("close", pararCamara);
$("#camCancel").onclick = () => $("#cam").close();
$("#snap").onclick = () => {
  const v = $("#vid");
  if (!stream || !v.videoWidth) { $("#camMsg").textContent = "Todavía no hay imagen de la cámara."; return; }
  const c = $("#cv");
  const d = reducir(v, v.videoWidth, v.videoHeight);
  photos[camK] = d;
  $("#cam").close();
  renderPhotos();
};

// ---------- Formulario ----------
function openForm(id){
  editId = id || null;
  const o = id ? orders.find(x => x.id === id) || {} : {};
  $("#dlgTit").textContent = id ? "Editar pedido" : "Nuevo pedido";
  $("#fEstado").value = o.estado || "pendiente";
  $("#fGuia").value = o.guia || "";
  $("#fCli").value = o.cliente || "";
  $("#fProd").value = o.producto || "";
  $("#fCat").value = o.destino || cats[0];
  $("#fFecha").value = o.fecha || selDay || hoy(new Date());
  $("#fHora").value = o.hora || "";
  $("#fNotas").value = o.notas || "";
  $("#borrar").style.display = id ? "" : "none";
  armado = false;
  $("#borrar").textContent = "Eliminar";
  $("#borrar").style.background = "";
  $("#borrar").style.color = "#dc2626";
  $("#avisoF").style.display = "none";
  photos = {...(o.fotos || {})};
  renderPhotos();
  $("#dlg").showModal();
}

$("#form").onsubmit = async e => {
  e.preventDefault();
  const o = {
    id: editId || Date.now().toString(),
    estado: $("#fEstado").value,
    guia: $("#fGuia").value.trim(),
    cliente: $("#fCli").value.trim(),
    producto: $("#fProd").value.trim(),
    destino: $("#fCat").value,
    fecha: $("#fFecha").value,
    hora: $("#fHora").value,
    notas: $("#fNotas").value.trim(),
    fotos: {...photos}
  };
  if (o.estado === "completado" && faltan(o).length){
    aviso(msgFaltan(o));
    return;
  }
  if (orders.some(x => x.id !== o.id && x.guia.toLowerCase() === o.guia.toLowerCase())
      ) aviso("Aviso: ya existe otro pedido con esa guía.");
  orders = editId ? orders.map(x => x.id === editId ? o : x) : [...orders, o];
  await saveOrders();
  $("#dlg").close();
  refresh();
};

let armado = false;
$("#borrar").onclick = async () => {
  if (!editId) return;
  if (!armado){
    armado = true;
    $("#borrar").textContent = "¿Confirmar eliminar?";
    $("#borrar").style.background = "#dc2626";
    $("#borrar").style.color = "#fff";
    return;
  }
  orders = orders.filter(o => o.id !== editId);
  await saveOrders();
  $("#dlg").close();
  aviso("Pedido eliminado");
  refresh();
};
$("#cancel").onclick = () => $("#dlg").close();

// ---------- Cambio rápido de estado desde la tarjeta ----------
async function setEstado(id, v){
  const o = orders.find(x => x.id === id);
  if (!o) return;
  if (v === "completado" && faltan(o).length){
    aviso(msgFaltan(o));
    refresh();
    return;
  }
  o.estado = v;
  await saveOrders();
  refresh();
}

async function handleClick(e){
  const t = e.target;
  if (t.dataset.e) return openForm(t.dataset.e);
  if (t.dataset.v){
    const [id, k] = t.dataset.v.split("|");
    const o = orders.find(x => x.id === id);
    $("#big").src = o.fotos[k];
    $("#viewer").showModal();
  }
}
function handleChange(e){
  if (e.target.dataset.s) setEstado(e.target.dataset.s, e.target.value);
}
for (const id of ["#lista", "#diaLista"]){
  $(id).onclick = handleClick;
  $(id).onchange = handleChange;
}
$("#grid").onclick = e => {
  const b = e.target.closest("[data-d]");
  if (!b) return;
  selDay = b.dataset.d;
  renderCal();
};

// ---------- Navegación y búsqueda ----------
$("#q").oninput = render;
$("#fDest").onchange = render;
$("#fEst").onchange = render;
$("#nuevo").onclick = () => openForm();
$("#prev").onclick = () => { cur.setMonth(cur.getMonth() - 1); renderCal(); };
$("#next").onclick = () => { cur.setMonth(cur.getMonth() + 1); renderCal(); };
$("#tabP").onclick = () => showTab("P");
$("#tabC").onclick = () => showTab("C");
function showTab(t){
  $("#vPedidos").classList.toggle("hidden", t !== "P");
  $("#vCal").classList.toggle("hidden", t !== "C");
  $("#tabP").className = t === "P" ? "p" : "";
  $("#tabC").className = t === "C" ? "p" : "";
  $("#nuevo").style.display = t === "P" ? "" : "none";
  if (t === "C") renderCal();
}

function refresh(){ fillFilters(); render(); renderCal(); }

// ---------- Inicio ----------
(async () => {
  orders = ((await kvGet("orders")) || []).map(o => ({
    ...o,
    estado: o.estado || (o.completado ? "completado" : "pendiente")
  }));
  cats = (await kvGet("cats")) || [...CATS0];
  refresh();
  showTab("P");
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
